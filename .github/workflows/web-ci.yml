name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Bun is the project's only toolchain (lib/bun-floor.ts pins the floor).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
          cache: true
          cache-dependency-path: web/bun.lock
      # The doctor parity test runs the real core doctor.ts, which imports the
      # core's own dependencies (js-yaml, dotenv). Installed from the core's own
      # bun.lock, without lifecycle scripts (no browser download).
      - name: Install core dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
