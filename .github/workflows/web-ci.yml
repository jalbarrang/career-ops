name: Web CI

# CI for the experimental web UI (apps/web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The apps/web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun is the project's only toolchain (packages/core/src/kernel/bun-floor.ts pins the floor).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
          cache: true
          cache-dependency-path: bun.lock
      # One workspace, one lockfile: the app and the engine its doctor parity test
      # runs install together from the repository root.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build the app
        run: |
          cd apps/web
          bun test
          bunx tsc --noEmit
          bun run build
