name: Tests

on:
  pull_request:
    branches: [main]
  # The merge queue builds a temporary merge commit per group and needs the
  # same required checks to report on it; without this trigger every queued
  # PR would wait forever on `test (...)`.
  merge_group:

# merge_group runs carry the base repo's GITHUB_TOKEN (write-capable by
# default, unlike a fork pull_request) while executing code that came from a
# fork. Nothing in this workflow needs to write, and no other secret is
# referenced here, so the token is pinned read-only and never persisted.
permissions:
  contents: read

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Without a limit a hung job holds its runner for GitHub's default of six
    # hours. test-all.ts kills a discovered suite that runs past its budget,
    # but its inline sections and the install steps have no limit of their
    # own. The slowest leg (macOS) takes about 11 minutes.
    timeout-minutes: 30
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # Test code (fork code, in a merge_group) must not find a token in .git/config.
          persist-credentials: false
      # The declared floor (packages/core/src/kernel/bun-floor.ts, package.json engines). Exact on
      # purpose: a bare '1' resolves to the newest 1.x and tests nothing.
      # tests/bun-floor.test.ts fails if this drifts from BUN_MIN, so it is hand-edited.
      - name: Set up the Bun floor (1.4.3)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun run lint
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # The module lives in dashboard/, so without this setup-go looks for
          # go.sum at the root, warns, and caches nothing.
          cache-dependency-path: dashboard/go.sum
      # Skip the postinstall (bunx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test-all.ts --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard

  cv-visual:
    runs-on: ubuntu-latest
    # About 3 minutes, image build included. Limited for the test job's reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the canonical CV rendering environment
        run: docker build --platform linux/amd64 --tag career-ops-cv-visual tests/cv-visual
      - name: Check every CV template and PDF page
        run: |
          docker run --rm --init --ipc=host --platform linux/amd64 \
            --volume "$PWD:/work" --volume /work/node_modules \
            career-ops-cv-visual \
            sh -c 'bun install --frozen-lockfile --ignore-scripts && bun run test:cv-visual'
      - name: Upload CV visual diffs and rendered previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-visual-artifacts
          path: |
            test-results/cv-visual-artifacts/
            test-results/cv-visual-results/
          if-no-files-found: ignore
  upgrade-gate:
    name: Upgrade regression gate
    runs-on: ubuntu-latest
    # About 2 minutes. Limited for the test job's reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # harness needs release tags
          persist-credentials: false # the harness only ever touches a local mirror
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'   # old updaters rebuild the dashboard during apply
          cache-dependency-path: dashboard/go.sum
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Upgrade PR gate (newest old release -> this commit)
        run: bun upgrade-tests.ts --pr-gate
      - name: Canary (harness must be able to fail)
        run: bun upgrade-tests.ts --canary
      - name: Local-paths declaration survives a real apply (#2421)
        run: bun upgrade-tests.ts --local-paths
      - name: User-layer manifest entry is refused, not fatal (#3782)
        run: bun upgrade-tests.ts --user-layer-refusal
      - name: Failed bun install is reported, rollback reinstalls
        run: bun upgrade-tests.ts --failed-install
